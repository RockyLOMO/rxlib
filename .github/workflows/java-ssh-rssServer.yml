name: Build & Push to ssh - rssServer
on:
  workflow_dispatch:    # 支持手动触发
    inputs:
      servers:
        description: "部署目标。new104 灰度机已于 2026-09-08 彻底关闭，默认只打 main。"
        required: true
        type: choice
        default: "main"
        options:
          - main
          - all

permissions:
  contents: read
jobs:
  publish:
    uses: ./.github/workflows/rss-publish.yml
    with:
      role: server
    secrets:
      deploy: ${{ secrets.RSS_DEPLOY }}
