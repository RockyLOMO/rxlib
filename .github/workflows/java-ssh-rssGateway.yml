name: Build & Push to ssh - rssGateway
# copy logback
on:
  workflow_dispatch:    # 支持手动触发
    inputs:
      deploy_mode:
        description: 发布策略：replace 替换旧进程，coexist 新老并存
        required: true
        default: replace
        type: choice
        options:
          - replace
          - coexist
      reuseport_migration_fallback:
        description: replace 并行切换失败时，允许首次迁移兼容重启
        required: true
        default: true
        type: boolean
  push:
    branches: [ rss-21 ]

permissions:
  contents: read
jobs:
  publish:
    uses: ./.github/workflows/rss-publish.yml
    with:
      role: client
      mode: ${{ inputs.deploy_mode || 'replace' }}
      fallback: ${{ github.event_name == 'push' || inputs.reuseport_migration_fallback }}
    secrets:
      deploy: ${{ secrets.RSS_DEPLOY }}
